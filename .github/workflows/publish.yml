name: Publish npm
on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm distribution tag (latest by default; next for previews)
        type: choice
        options: [latest, next]
        default: latest
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Require acceptance on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          successful_runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq '.total_count')
          test "$successful_runs" -gt 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run test:package
      - run: npm audit --omit=dev --audit-level=high
      - run: npm publish --provenance --access public --tag ${{ inputs.tag }}
      - name: Wait for public registry metadata
        run: |
          package_spec=$(node -p "const p=require('./package.json'); p.name+'@'+p.version")
          registry_result="$RUNNER_TEMP/npm-public-version.json"
          for attempt in {1..30}; do
            if npm view "$package_spec" dist.integrity --json --registry=https://registry.npmjs.org --prefer-online --fetch-retries=0 --fetch-timeout=10000 --logs-max=0 > "$registry_result"; then
              exit 0
            fi
            node -e "const fs=require('node:fs'); const result=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); if(result.error?.code!=='E404') process.exit(1)" "$registry_result"
            if [ "$attempt" -eq 30 ]; then
              echo "Published version did not become available in time. Verify the registry before retrying publication."
              exit 1
            fi
            echo "Waiting for npm processing ($attempt/30)"
            sleep 10
          done
      - name: Public registry smoke
        run: |
          package_version=$(node -p "require('./package.json').version")
          package_name=$(node -p "require('./package.json').name")
          export PUBLISHED_PACKAGE_SPEC="$package_name@$package_version"
          npm run test:package
