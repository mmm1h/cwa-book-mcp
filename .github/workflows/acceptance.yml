name: isolated acceptance
on:
  push:
    branches:
      - 'validation/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-cwa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - name: Start an unmodified isolated CWA
        env:
          CWA_IMAGE: ghcr.io/crocodilestick/calibre-web-automated:v4.0.8
        run: |
          mkdir -p .work "$RUNNER_TEMP/cwa-config" "$RUNNER_TEMP/cwa-ingest" "$RUNNER_TEMP/cwa-library"
          docker pull "$CWA_IMAGE"
          docker image inspect --format '{{json .RepoDigests}}' "$CWA_IMAGE" > .work/cwa-image.json
          docker run -d --name cwa-original -p 127.0.0.1:8083:8083 \
            -e PUID="$(id -u)" -e PGID="$(id -g)" -e TZ=UTC \
            -v "$RUNNER_TEMP/cwa-config:/config" \
            -v "$RUNNER_TEMP/cwa-ingest:/cwa-book-ingest" \
            -v "$RUNNER_TEMP/cwa-library:/calibre-library" "$CWA_IMAGE"
          printf '%s' 'admin123' > "$RUNNER_TEMP/cwa-test-password"
      - name: Original CWA EPUB and PDF conversion loop
        env:
          CWA_INTEGRATION: '1'
          CWA_BASE_URL: http://localhost:8083
          CWA_USERNAME: admin
          CWA_PASSWORD_FILE: ${{ runner.temp }}/cwa-test-password
        run: go test -tags integration ./internal/integration -v -timeout 10m | tee .work/original-cwa.txt
      - name: Collect failure evidence
        if: failure()
        run: docker logs --tail 120 cwa-original
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-cwa-evidence
          path: |
            .work/original-cwa.txt
            .work/cwa-image.json
          retention-days: 14
      - name: Remove isolated CWA
        if: always()
        run: docker rm -f cwa-original
  resources:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - run: go test ./... -timeout 90s
      - run: go test -race ./internal/store ./internal/files ./internal/jobs ./internal/catalog ./internal/server -timeout 120s
      - name: Build local non-root release image
        run: docker build --build-arg TARGETARCH=${{ matrix.arch }} --build-arg VERSION=${{ github.sha }} -t cwa-book-mcp:acceptance .
      - name: Full 128 MiB resource load
        run: go run ./tools/bench -docker-image cwa-book-mcp:acceptance -work .work/bench-${{ matrix.arch }} -report .work/resources-${{ matrix.arch }}.json -idle 5m -stable 30m -sequential 100 -history 1000
      - name: Enforce resource gates
        run: go run ./tools/check-report .work/resources-${{ matrix.arch }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resources-${{ matrix.arch }}
          path: .work/resources-${{ matrix.arch }}.json
          retention-days: 14
