services:
  cwa-book-mcp:
    image: cwa-book-mcp:local
    build:
      context: .
      args:
        VERSION: local
    restart: unless-stopped
    env_file: .env
    environment:
      STATE_DIR: /data/state
      STAGING_DIR: /data/staging
      MCP_TOKEN_FILE: /run/secrets/mcp-token
      TICKET_KEY_FILE: /run/secrets/ticket-key
      CWA_PASSWORD_FILE: /run/secrets/cwa-password
      ZLIB_SESSION_FILE: /data/state/zlib-session.json
      GOMEMLIMIT: 64MiB
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - book-state:/data/state
      - book-staging:/data/staging
      - ./secrets/mcp-token:/run/secrets/mcp-token:ro
      - ./secrets/ticket-key:/run/secrets/ticket-key:ro
      - ./secrets/cwa-password:/run/secrets/cwa-password:ro
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 128
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s
volumes:
  book-state:
  book-staging:
